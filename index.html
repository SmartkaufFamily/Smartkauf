
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#137a53">
<title>SmartKauf</title>
  <style>
*{box-sizing:border-box}
  body{background:#eef4f0}
header{background:linear-gradient(135deg,#075c43,#12956b);padding:32px 22px}
section{border-radius:26px;box-shadow:0 8px 28px #123e3012}
button{border-radius:14px}
input,select{border-radius:14px}
.big{color:#087b55}
body{margin:0;background:#f3f6f4;color:#183329;font-family:system-ui,-apple-system,sans-serif}
header{background:#137a53;color:white;padding:25px 20px;border-radius:0 0 24px 24px}
h1{margin:0;font-size:28px}
header p{margin:5px 0 0;opacity:.85}
main{max-width:650px;margin:auto;padding:16px}
section{background:white;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 2px 12px #00000009}
h2{font-size:19px;margin:0 0 15px}
input,select,button{font:inherit;border-radius:10px;padding:12px;min-width:0}
input,select{border:1px solid #d4ddd7;background:white;width:100%;margin-bottom:9px}
button{border:0;background:#137a53;color:white;font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.big{font-size:28px;font-weight:750;color:#137a53}
.muted{color:#718078;font-size:13px}
.progress{background:#e8eee9;height:12px;border-radius:20px;overflow:hidden;margin:12px 0}
.bar{background:#19a66e;height:100%;width:0%;transition:.2s}
.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf0ee;padding:13px 0}
.item:last-child{border:0}
.item input{width:22px;height:22px;margin:0;accent-color:#137a53}
.details{flex:1;min-width:0}
.details strong{display:block;overflow-wrap:anywhere}
.done strong{text-decoration:line-through;color:#9ca9a1}
.small{font-size:12px;color:#718078}
.remove{background:#fcebea;color:#b32d2d;padding:8px 12px}
.empty{text-align:center;padding:25px;color:#718078}
.warning{color:#b32d2d}
</style>
</head>
<body>
<header>
<h1>🛒 SmartKauf</h1>
<p>Dein Einkauf. Dein Budget. Deine Familie.</p>
</header>
<main>
<section>
<h2>💰 Einkaufsbudget</h2>
<label for="budget">Dein Budget in Euro</label>
<input id="budget" type="number" min="0" step=".01" value="50">
<div class="grid">
<div><span class="muted">Geplant</span><div class="big" id="total">0,00 €</div></div>
<div><span class="muted">Übrig</span><div class="big" id="left">50,00 €</div></div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="muted" id="status">Dein Einkauf im Überblick</p>
</section>
<section>
<h2>➕ Produkt hinzufügen</h2>
<form id="form">
<input id="name" placeholder="Produkt, z. B. Milch" required maxlength="100">
<div class="grid">
<input id="qty" type="number" value="1" min=".01" step="any" aria-label="Menge" required>
<select id="unit" aria-label="Einheit">
<option>Stück</option><option>Packung</option><option>kg</option><option>g</option><option>Liter</option><option>Flasche</option>
</select>
</div>
<div class="grid">
<select id="category" aria-label="Kategorie">
<option>Obst & Gemüse</option><option>Milchprodukte</option><option>Brot & Backwaren</option><option>Fleisch & Fisch</option><option>Getränke</option><option>Haushalt</option><option>Sonstiges</option>
</select>
<input id="price" type="number" min="0" step=".01" value="0" aria-label="Preis pro Einheit">
</div>
<button type="submit" style="width:100%">Zur Einkaufsliste hinzufügen</button>
</form>
<p class="muted">Preis pro Einheit in Euro, z. B. 1,49 € pro Packung.</p>
</section>
<section>
<h2>📝 Meine Einkaufsliste</h2>
<p class="muted" id="count"></p>
<div id="list"></div>
</section>
</main>
<script>
const key="smartkauf-v1";
let data;
try{data=JSON.parse(localStorage.getItem(key))||{}}
catch(e){data={}}
let items=Array.isArray(data.items)?data.items:[];
const el=id=>document.getElementById(id);
el("budget").value=data.budget??50;
const money=n=>Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
function save(){
try{localStorage.setItem(key,JSON.stringify({items,budget:el("budget").value}))}
catch(e){el("status").textContent="Speichern im Browser nicht möglich."}
}
function render(){
const total=items.reduce((s,x)=>s+x.qty*x.price,0);
const budget=Math.max(0,Number(el("budget").value)||0);
el("total").textContent=money(total);
el("left").textContent=money(budget-total);
el("left").className="big"+(total>budget?" warning":"");
el("bar").style.width=(budget?Math.min(100,total/budget*100):total?100:0)+"%";
el("bar").style.background=total>budget?"#d84b4b":"#19a66e";
el("status").textContent=total>budget?"Budget um "+money(total-budget)+" überschritten":"Du hast "+money(budget-total)+" übrig.";
el("count").textContent=items.filter(x=>x.done).length+" von "+items.length+" erledigt";
const list=el("list");list.replaceChildren();
if(!items.length){const p=document.createElement("p");p.className="empty";p.textContent="Noch keine Produkte. Füge dein erstes hinzu!";list.append(p)}
for(const x of items){
const row=document.createElement("div");row.className="item"+(x.done?" done":"");
const check=document.createElement("input");check.type="checkbox";check.checked=x.done;check.setAttribute("aria-label",x.name+" abhaken");
check.onchange=()=>{x.done=check.checked;save();render()};
const detail=document.createElement("div");detail.className="details";
const strong=document.createElement("strong");strong.textContent=x.name;
const small=document.createElement("span");small.className="small";
small.textContent=x.qty+" "+x.unit+" · "+x.category+" · "+money(x.qty*x.price);
detail.append(strong,small);
const del=document.createElement("button");del.className="remove";del.textContent="✕";del.setAttribute("aria-label",x.name+" löschen");
del.onclick=()=>{items=items.filter(y=>y.id!==x.id);save();render()};
row.append(check,detail,del);list.append(row)
}
}
el("form").onsubmit=e=>{
e.preventDefault();
const name=el("name").value.trim(),qty=Number(el("qty").value),price=Number(el("price").value);
if(!name||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0)return;
items.push({id:Date.now()+"-"+Math.random(),name,qty,price,unit:el("unit").value,category:el("category").value,done:false});
save();render();el("name").value="";el("qty").value=1;el("price").value=0;el("name").focus();
};
el("budget").oninput=()=>{save();render()};
render();
</script>
</body>
</html>
